services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty-growth-postgres
    environment:
      POSTGRES_DB: beauty_growth
      POSTGRES_USER: beauty_app
      POSTGRES_PASSWORD: beauty_app_password
    ports:
      - "5432:5432"
    volumes:
      - beauty_growth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty_app -d beauty_growth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  beauty_growth_pgdata:

