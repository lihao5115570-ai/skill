services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_growth}
      POSTGRES_USER: ${POSTGRES_USER:-beauty_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - beauty_ai_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beauty_app} -d ${POSTGRES_DB:-beauty_growth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: beauty-ai-backend
    environment:
      APP_NAME: AI Beauty Growth API
      API_PREFIX: /api/v1
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+psycopg://beauty_app:beauty_app_password@postgres:5432/beauty_growth}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: beauty-ai-analysis
    environment:
      MODEL_PROVIDER: ${AI_SERVICE_MODEL_PROVIDER:-mock}
      STORAGE_PATH: ${AI_SERVICE_STORAGE_PATH:-/app/storage/uploads}
    ports:
      - "${AI_SERVICE_PORT:-8100}:8100"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: beauty-ai-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  beauty_ai_pgdata:
